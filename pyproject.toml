[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stainnormprogram"
dynamic = ["version"]
description = 'A program that does stain normalization.'
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = []
authors = [
  { name = "peterhsu-uiuc", email = "pwhsu2@illinois.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "tifffile==2026.6.1",
  "numpy",
  "pyvips[binary]",
  "scikit-learn",
  "scikit-image",
  "colour-science",
  "zarr",
  "fastdigest",
  "openslide-python",
  "openslide-bin",
  "Pillow",
  "bioio",
  "bioio-bioformats",
  "imagecodecs",
  "scipy",
  "plotly",
  "bitarray",
  "fast_colorthief",
  "matplotlib",
]

[project.urls]
Documentation = "https://github.com/peterhsu-uiuc/StainNormProgram#readme"
Issues = "https://github.com/peterhsu-uiuc/StainNormProgram/issues"
Source = "https://github.com/peterhsu-uiuc/StainNormProgram"

[tool.hatch.version]
path = "src/stainnormprogram/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/stainnormprogram tests}"

[tool.coverage.run]
source_pkgs = ["stainnormprogram", "tests"]
branch = true
parallel = true
omit = [
  "src/stainnormprogram/__about__.py",
]

[tool.coverage.paths]
stainnormprogram = ["src/stainnormprogram", "*/stainnormprogram/src/stainnormprogram"]
tests = ["tests", "*/stainnormprogram/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
